# Publica a demonstração estática (núcleo rodando no navegador) no GitHub Pages.
# Antes de publicar, roda os testes do núcleo e da interface; se algum falhar, nada é publicado.
name: Publicar demonstração no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dependências do núcleo (só desenvolvimento)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Testes, sintaxe e tipos do núcleo
        run: npm test && npm run check && npm run typecheck
      - name: Dependências da interface
        run: npm run interface:instalar
      - name: Tipos e testes da interface
        run: npm run interface:typecheck && npm run interface:test
      - name: HTML único e site estático
        run: npm run interface:build && npm run site:estatico
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: interface/dist/github-pages

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - id: publicacao
        uses: actions/deploy-pages@v4
